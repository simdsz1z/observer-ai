[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observer-ai-local"
version = "0.3.0"
description = "Local screen intelligence, Qwen chat, and video analysis for Windows"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "mss>=10.2,<11",
  "Pillow>=11,<13",
  "psutil>=6,<8",
  "uiautomation>=2.0.20,<3; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/simdsz1z/observer-ai"
Issues = "https://github.com/simdsz1z/observer-ai/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
observer-ai = "observer.__main__:main"

[tool.setuptools.packages.find]
include = ["observer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

